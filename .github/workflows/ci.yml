name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --select E9,F63,F7,F82 .

      - name: Pytest
        run: pytest -q
        env:
          PYTHONIOENCODING: utf-8

      - name: Eval harness (stub, LLM'siz)
        run: |
          python evals/make_tasks.py
          python evals/run.py --stub
        if: runner.os == 'Linux'

      - name: MCP stdio smoke (acilis + katalog + cagri)
        run: python scripts/mcp_smoke.py
        env:
          PYTHONIOENCODING: utf-8
